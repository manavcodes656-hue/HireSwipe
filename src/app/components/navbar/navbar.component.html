<nav class="navbar" [class.scrolled]="scrolled" role="navigation" aria-label="Main Navigation">
  <div class="nav-inner">
    <a class="nav-logo" href="#home" (click)="closeMenu()" aria-label="HireSwipe Home">
      <img src="logo.png" alt="HireSwipe" class="nav-logo-img" />
    </a>

    <div class="nav-links" [class.open]="menuOpen">
      <a href="#home" [class.active]="activeId === 'home'" (click)="closeMenu()">Home</a>
      <a href="#about" [class.active]="activeId === 'about'" (click)="closeMenu()">About</a>
      <a href="#how-it-works" [class.active]="activeId === 'how-it-works'" (click)="closeMenu()">How It Works</a>
      <a href="#workflow" [class.active]="activeId === 'workflow'" (click)="closeMenu()">Workflow / Statistics</a>
      <a href="#solution" [class.active]="activeId === 'solution'" (click)="closeMenu()">Solution</a>
      <a href="#contact" [class.active]="activeId === 'contact'" (click)="closeMenu()">Contact</a>
      <div class="mobile-auth">
        <button class="login-btn" type="button" routerLink="/login" (click)="closeMenu()">Login</button>
        <button class="signup-btn" type="button" routerLink="/signup" (click)="closeMenu()">Get Started</button>
      </div>
    </div>

    <div class="nav-auth">
      <button class="login-btn" type="button" routerLink="/login">Login</button>
      <button class="signup-btn" type="button" routerLink="/signup">Get Started</button>
    </div>

    <button
      class="hamburger"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle menu"
    >
      <svg
        *ngIf="!menuOpen"
        class="hamburger-icon"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="12" x2="20" y2="12"></line>
        <line x1="4" y1="18" x2="20" y2="18"></line>
      </svg>
      <svg
        *ngIf="menuOpen"
        class="hamburger-icon"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="nav-overlay" [class.open]="menuOpen" (click)="closeMenu()"></div>
</nav>
