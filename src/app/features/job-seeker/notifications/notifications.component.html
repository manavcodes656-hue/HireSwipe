<div class="notif-page-wrapper">
  <!-- Page Header -->
  <div class="page-header-card">
    <div class="header-left">
      <h1 class="page-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        Notifications Center
      </h1>
      <p class="page-sub">Real-time alerts for matches, applications, messages, and interview invites.</p>
    </div>

    <button class="secondary-btn sm" (click)="markAllAsRead()" *ngIf="jobSeekerService.unreadNotificationCount() > 0">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <span>Mark All as Read</span>
    </button>
  </div>

  <!-- Filter Pills -->
  <div class="filter-pills-row">
    <button
      *ngFor="let f of filterList"
      class="filter-pill"
      [class.active]="selectedFilter() === f.value"
      (click)="selectedFilter.set(f.value)"
    >
      {{ f.label }}
    </button>
  </div>

  <!-- Notifications List -->
  <div class="notif-list" *ngIf="filteredNotifications().length > 0; else emptyNotifs">
    <div
      class="notif-card"
      *ngFor="let n of filteredNotifications()"
      [class.unread]="!n.read"
      (click)="markAsRead(n)"
    >
      <div class="notif-type-icon" [class]="n.type">
        <svg *ngIf="n.type === 'new_match' || n.type === 'match'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        <svg *ngIf="n.type === 'new_message' || n.type === 'message'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <svg *ngIf="n.type === 'interview'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <svg *ngIf="n.type === 'application_update' || n.type === 'application'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        <svg *ngIf="n.type === 'job_recommendation' || n.type === 'system'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </div>

      <div class="notif-content">
        <div class="notif-top">
          <h3 class="notif-title">{{ n.title }}</h3>
          <span class="notif-time">{{ n.created_at }}</span>
        </div>
        <p class="notif-msg">{{ n.message }}</p>
      </div>

      <span class="unread-dot" *ngIf="!n.read"></span>
      <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </div>
  </div>

  <ng-template #emptyNotifs>
    <div class="empty-card">
      <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
      <h2>No notifications found</h2>
      <p>You have no notifications in this category.</p>
    </div>
  </ng-template>
</div>
